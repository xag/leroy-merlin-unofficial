[project]
name = "leroy-merlin-unofficial"
version = "0.1.0"
description = "The wood panels Leroy Merlin France sells, each line read as a class or maker board of wood-panels, as data on furniture-design's kinds. Unofficial: not written or endorsed by Leroy Merlin."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later AND CC-BY-NC-ND-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
dependencies = ["quern", "furniture-design", "wood-panels"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leroy_merlin_unofficial"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-testmon>=2.1"]

[tool.uv.sources]
# Pinned by full rev, always, and to the same quern as furniture-design: uv accepts one URL
# per distribution across a resolution.
quern = { git = "https://github.com/xag/quern", rev = "07eff6efc0625ee0613a083095db4e6b75be7284" }
furniture-design = { git = "https://github.com/xag/furniture-design", rev = "104a39387a891839fe832c7656d670af348fce92" }
wood-panels = { git = "https://github.com/xag/wood-panels", rev = "0e9f389e6bdf0d78f6a62d07647f40fb09001421" }

[tool.pytest.ini_options]
pythonpath = ["."]
# Fail fast: stop at the first failure, run last time's failures first.
# First pass `pytest --testmon` (failed and changed tests), then the whole suite with `pytest`.
addopts = "-x --ff"
