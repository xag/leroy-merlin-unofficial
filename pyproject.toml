[project]
name = "leroy-merlin-unofficial"
version = "0.1.0"
description = "The wood panels Leroy Merlin France sells, each line read as a class or maker board of wood-panels, as data on furniture-design's kinds. Unofficial: not written or endorsed by Leroy Merlin."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later AND CC-BY-NC-ND-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
dependencies = ["quern", "furniture-design", "wood-panels"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leroy_merlin_unofficial"]

[dependency-groups]
dev = ["pytest>=8.0.0", "testplan"]

[tool.uv]
# wood-panels still pins an earlier furniture-design and quern; these are the ones this package is judged by.
override-dependencies = ["furniture-design @ git+https://github.com/xag/furniture-design@3e6e331ea828f2456bbfb0b24f6cad11ab19c3ff", "quern @ git+https://github.com/xag/quern@94ca5cf5f58b2b0b090cd4c93a44c906a5511e7d"]

[tool.uv.sources]
testplan = { git = "https://github.com/xag/testplan", rev = "fe886041c5c20d03d6b8f07137836572e0155e03" }
# Pinned by full rev, always, and to the same quern as furniture-design: uv accepts one URL
# per distribution across a resolution.
quern = { git = "https://github.com/xag/quern", rev = "94ca5cf5f58b2b0b090cd4c93a44c906a5511e7d" }
furniture-design = { git = "https://github.com/xag/furniture-design", rev = "3e6e331ea828f2456bbfb0b24f6cad11ab19c3ff" }
wood-panels = { git = "https://github.com/xag/wood-panels", rev = "47a97f6886aebbd312c5d09dc21e1caebd8b4ad8" }

[tool.pytest.ini_options]
pythonpath = ["."]
# Fail fast: stop at the first failure. testplan runs the tests whose code, data or packages
# changed since they passed, last failures first then the fastest, under a time budget, and
# keeps every run's times; `pytest --all` runs them all, once a day.
addopts = "-x"
